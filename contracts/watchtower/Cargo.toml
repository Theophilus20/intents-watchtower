[package]
name = "watchtower"
version = "1.0.0"
edition = "2021"
description = "watchtower.near: on-chain route-health oracle and circuit breaker for NEAR Intents"
license = "MIT"
repository = "https://github.com/intents-watchtower/intents-watchtower"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0" }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde_json = "1"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
